name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --check
      - run: cargo +1.95.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 build --release --locked
