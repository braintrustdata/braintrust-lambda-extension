# Integration test services — one per SDK.
#
# Each service is self-contained: its container runs the shared harness, which stands up
# the mock sink, the mock Lambda API, the real extension binary, and the SDK app, then
# asserts a marked trace reaches the sink. Build context is the repo root so the images
# can COPY the extension source and the harness.
#
# Active by default: python, typescript.
# OTLP SDKs (ruby/go/java/dotnet) are defined but gated behind the "unsupported" profile
# because the extension has no /otel/v1/traces route yet — run them with
#   docker compose --profile unsupported run --rm app-ruby   (expected to FAIL until OTLP lands)

services:
  app-python:
    build:
      context: ..
      dockerfile: integration/apps/python/Dockerfile

  app-typescript:
    build:
      context: ..
      dockerfile: integration/apps/typescript/Dockerfile

  app-ruby:
    profiles: ["unsupported"]
    build:
      context: ..
      dockerfile: integration/apps/ruby/Dockerfile

  app-go:
    profiles: ["unsupported"]
    build:
      context: ..
      dockerfile: integration/apps/go/Dockerfile

  app-java:
    profiles: ["unsupported"]
    build:
      context: ..
      dockerfile: integration/apps/java/Dockerfile

  app-dotnet:
    profiles: ["unsupported"]
    build:
      context: ..
      dockerfile: integration/apps/dotnet/Dockerfile
