[package]
name = "braintrust-lambda-extension"
version = "0.1.0"
edition = "2021"
description = "AWS Lambda extension that proxies Braintrust SDK tracing off the handler's critical path."
license = "Apache-2.0"
repository = "https://github.com/braintrustdata/braintrust-lambda-extension"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
